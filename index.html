<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS liest keine Manifest-Icons; ohne apple-touch-icon nimmt Safari
         einen Screenshot der Seite als Homescreen-Symbol. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover ist Voraussetzung dafür, dass env(safe-area-inset-*)
         überhaupt Werte liefert. user-scalable=no greift in der installierten
         PWA; im Safari-Tab übernimmt das Blocken der Gesture-Events in
         main.tsx. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f2ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- `default` statt `black-translucent`: bei `black-translucent` laeuft der
         Inhalt unter die Statusleiste und deren Schrift bleibt weiss - auf dem
         hellen Grund waere sie unsichtbar. Mit `default` reserviert iOS die
         Leiste und zeichnet dunkle Schrift; `env(safe-area-inset-top)` liefert
         dann 0, weshalb das Padding oben ueberall einen Mindestwert hat. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym Book" />
    <meta
      name="description"
      content="Offline-first Trainingsprotokoll: Vorlagen, Sessions, Satz-Logging und Historie - vollständig lokal auf dem Gerät."
    />
    <title>Gym Book</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
